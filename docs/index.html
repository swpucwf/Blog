<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space for swpucwf</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <!-- Vue 主题附加（保持 v4 外观），必须加在 core 主题之后 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <style>
    /* 资料列表自动编号（顶层条目 1./2./3.，嵌套子项 1.1）。
       只给 a.page-link 加号；docsify 自动生成的页内目录是 a.section-link，天然不会被叠加。
       链接可能直接子于 li 也可能包在 li>p 里，两种都写。 */
    .sidebar-nav > ul { counter-reset: doc-l1; }
    .sidebar-nav > ul > li { counter-increment: doc-l1; }
    .sidebar-nav > ul > li > a.page-link::before,
    .sidebar-nav > ul > li > p > a.page-link::before {
      content: counter(doc-l1) ". ";
      color: var(--theme-color, currentColor);
    }
    .sidebar-nav > ul > li > ul { counter-reset: doc-l2; }
    .sidebar-nav > ul > li > ul > li { counter-increment: doc-l2; }
    .sidebar-nav > ul > li > ul > li > a.page-link::before,
    .sidebar-nav > ul > li > ul > li > p > a.page-link::before {
      content: counter(doc-l1) "." counter(doc-l2) " ";
      color: var(--theme-color, currentColor);
    }

    /* 章节编号：h2/h3/h4 全部由计数器生成（1. / 1.1 / 1.1.1），正文不再手写序号。
       正文与侧边栏目录各一套计数器但层级对应，保证同一节在两处序号一致。
       目录层级由 genTree 决定：h1 = .app-sub-sidebar>li，h2 = >li>ul>li，h3 = >li>ul>li>ul>li */
    .markdown-section { counter-reset: h2n; }
    .markdown-section > h2 { counter-increment: h2n; counter-reset: h3n; }
    .markdown-section > h2::before { content: counter(h2n) ". "; }
    .markdown-section > h3 { counter-increment: h3n; counter-reset: h4n; }
    .markdown-section > h3::before { content: counter(h2n) "." counter(h3n) " "; }
    .markdown-section > h4 { counter-increment: h4n; }
    .markdown-section > h4::before { content: counter(h2n) "." counter(h3n) "." counter(h4n) " "; }

    .app-sub-sidebar { counter-reset: t2; }
    .app-sub-sidebar > li > ul > li { counter-increment: t2; counter-reset: t3; }
    .app-sub-sidebar > li > ul > li > a.section-link::before {
      content: counter(t2) ". ";
      color: var(--theme-color, currentColor);
    }
    .app-sub-sidebar > li > ul > li > ul > li { counter-increment: t3; }
    .app-sub-sidebar > li > ul > li > ul > li > a.section-link::before {
      content: counter(t2) "." counter(t3) " ";
      color: var(--theme-color, currentColor);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '笔记',
      repo: 'https://github.com/swpucwf/Blog',
      loadSidebar: true,
      auto2top: true,
      coverpage: true,
      subMaxLevel: 3,
      alias: {
          '/.*/_sidebar.md': '/_sidebar.md'
      },
      pagination: {
          previousText: '上一章节',
          nextText: '下一章节',
      },
      search: {
          paths: 'auto',
          placeholder: '搜索',
          noData: '找不到结果！',
          namespace: 'swpucwf-blog',
      },
      count:{
          countable: true,
          position: 'top',
          margin: '10px',
          float: 'right',
          fontsize:'0.9em',
          color:'rgb(90,90,90)',
          language:'chinese',
          isExpected: true
        }
    }
  </script>
 <!-- Put them above docsify.min.js -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <!-- full-text search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <!-- code render-->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <!-- reading time / word count -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count@1/dist/countable.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css" />
  <!-- docsify 已将内部 marked 暴露为 window.marked，此处不可再单独引入 marked，否则 search 插件解析表格时报错 -->
  <!-- CDN files for docsify-katex -->
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@2/dist/docsify-katex.js"></script>
</body>
</html>
