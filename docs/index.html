<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space for swpucwf</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <!-- Vue 主题附加（保持 v4 外观），必须加在 core 主题之后 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      repo: 'https://github.com/swpucwf/Blog',
      loadSidebar: true,
      auto2top: true,
      coverpage: true,
      subMaxLevel: 3,
      alias: {
          '/.*/_sidebar.md': '/_sidebar.md'
      },
      pagination: {
          previousText: '上一章节',
          nextText: '下一章节',
      },
      search: {
          paths: 'auto',
          placeholder: '搜索',
          noData: '找不到结果！',
          namespace: 'swpucwf-blog',
      },
      count:{
          countable: true,
          position: 'top',
          margin: '10px',
          float: 'right',
          fontsize:'0.9em',
          color:'rgb(90,90,90)',
          language:'chinese',
          isExpected: true
        }
    }
  </script>
  <!-- 自动刷新开关：在网址后加 ?autoreload=秒数 即可定时重载以加载最新内容（如 ?autoreload=5）。
       仅对带该参数的开发者生效，普通访客不受影响；加时间戳绕过缓存。默认关闭。 -->
  <script>
    (function () {
      var m = /[?&]autoreload=(\d+)/.exec(location.search);
      if (!m) return;
      var sec = Math.max(2, parseInt(m[1], 10) || 5);
      setTimeout(function () {
        var base = location.origin + location.pathname;
        // 保留 autoreload 参数，替换/追加时间戳以绕过缓存，实现持续自动刷新
        var clean = location.search.replace(/([?&])_ts=\d+(&?)/, '$1').replace(/[?&]$/, '');
        var joiner = clean.indexOf('?') >= 0 ? '&' : '?';
        // 保留 location.hash（docsify 用 hash 路由），刷新后停在当前页而非回首页
        location.href = base + clean + joiner + '_ts=' + Date.now() + location.hash;
      }, sec * 1000);
    })();
  </script>
 <!-- Put them above docsify.min.js -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <!-- full-text search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <!-- code render-->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <!-- reading time / word count -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count@1/dist/countable.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css" />
  <!-- docsify 已将内部 marked 暴露为 window.marked，此处不可再单独引入 marked，否则 search 插件解析表格时报错 -->
  <!-- CDN files for docsify-katex -->
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@2/dist/docsify-katex.js"></script>
</body>
</html>
