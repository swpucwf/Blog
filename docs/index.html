<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space for swpucwf</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <!-- Vue 主题附加（保持 v4 外观），必须加在 core 主题之后 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <style>
    /* ===== 字体协调 ===== */
    :root {
      /* 统一中英文字体族：优先苹方/微软雅黑/思源黑体，避免中英混排字形打架 */
      --base-font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                          "Noto Sans SC", -apple-system, "Segoe UI", Roboto,
                          Helvetica, Arial, sans-serif;
      --code-font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
                          Monaco, "Courier New", monospace;
    }
    body, .sidebar, .markdown-section {
      font-family: var(--base-font-family);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* 标题字号阶梯：h1>h2>h3>h4 逐级递减，字重适中（中文不宜过粗） */
    .markdown-section h1 { font-size: 1.85em; font-weight: 700; line-height: 1.3; }
    .markdown-section h2 { font-size: 1.5em;  font-weight: 700; letter-spacing: .3px; }
    .markdown-section h3 { font-size: 1.25em; font-weight: 600; }
    .markdown-section h4 { font-weight: 600; }
    /* 行内代码用等宽字体，字号略小于正文以协调 */
    .markdown-section code { font-family: var(--code-font-family); font-size: .9em; }

    /* 简历排版优化（前端） */
    .markdown-section { line-height: 1.85; }
    .markdown-section p { margin: 0.7em 0; }
    .markdown-section ul { margin: 0.7em 0; }
    .markdown-section li { margin: 0.4em 0; }
    /* 公司名（h3）与项目标题（h4）拉开层级，h4 加左侧强调条 */
    .markdown-section h3 { margin-top: 1.8em; }
    .markdown-section h4 {
      margin-top: 1.6em; margin-bottom: 0.6em;
      padding-left: 0.6em;
      border-left: 3px solid var(--theme-color, #42b983);
      font-size: 1.08em;
    }
    /* 联系方式：竖线 + 淡色卡片，更紧凑清晰 */
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color, #42b983);
      background: rgba(66, 185, 131, 0.06);
      padding: 0.9em 1.3em; margin: 1em 0;
    }
    .markdown-section blockquote p { margin: 0.3em 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      repo: 'https://github.com/swpucwf/Blog',
      loadSidebar: true,
      auto2top: true,
      coverpage: true,
      subMaxLevel: 3,
      alias: {
          '/.*/_sidebar.md': '/_sidebar.md'
      },
      pagination: {
          previousText: '上一章节',
          nextText: '下一章节',
      },
      search: {
          paths: 'auto',
          placeholder: '搜索',
          noData: '找不到结果！',
          namespace: 'swpucwf-blog',
      },
      count:{
          countable: true,
          position: 'top',
          margin: '10px',
          float: 'right',
          fontsize:'0.9em',
          color:'rgb(90,90,90)',
          language:'chinese',
          isExpected: true
        }
    }
  </script>
  <!-- 自动刷新开关：在网址后加 ?autoreload=秒数 即可定时重载以加载最新内容（如 ?autoreload=5）。
       仅对带该参数的开发者生效，普通访客不受影响；加时间戳绕过缓存。默认关闭。 -->
  <script>
    (function () {
      var m = /[?&]autoreload=(\d+)/.exec(location.search);
      if (!m) return;
      var sec = Math.max(2, parseInt(m[1], 10) || 5);
      setTimeout(function () {
        var base = location.origin + location.pathname;
        // 保留 autoreload 参数，替换/追加时间戳以绕过缓存，实现持续自动刷新
        var clean = location.search.replace(/([?&])_ts=\d+(&?)/, '$1').replace(/[?&]$/, '');
        var joiner = clean.indexOf('?') >= 0 ? '&' : '?';
        // 保留 location.hash（docsify 用 hash 路由），刷新后停在当前页而非回首页
        location.href = base + clean + joiner + '_ts=' + Date.now() + location.hash;
      }, sec * 1000);
    })();
  </script>
 <!-- Put them above docsify.min.js -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <!-- full-text search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <!-- code render-->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <!-- reading time / word count -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count@1/dist/countable.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css" />
  <!-- docsify 已将内部 marked 暴露为 window.marked，此处不可再单独引入 marked，否则 search 插件解析表格时报错 -->
  <!-- CDN files for docsify-katex -->
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@2/dist/docsify-katex.js"></script>
</body>
</html>
