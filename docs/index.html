<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space for swpucwf</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <!-- Vue 主题附加（保持 v4 外观），必须加在 core 主题之后 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <style>
    /* 侧边栏资料列表自动编号。
       依赖 docsify v5 运行时自己打的类：自定义导航链接 = a.page-link（自动目录是 a.section-link，天然排除），
       带子列表且自身无链接的分组 = li.group。链接可能直接子于 li 也可能包在 li>p 里，两种都写。*/
    .sidebar-nav li.group > ul { counter-reset: doc-l1; }
    .sidebar-nav li.group > ul > li { counter-increment: doc-l1; }
    .sidebar-nav li.group > ul > li > a.page-link::before,
    .sidebar-nav li.group > ul > li > p > a.page-link::before {
      content: counter(doc-l1) ". ";
      color: var(--theme-color, currentColor);
    }
    .sidebar-nav li.group > ul > li > ul { counter-reset: doc-l2; }
    .sidebar-nav li.group > ul > li > ul > li { counter-increment: doc-l2; }
    .sidebar-nav li.group > ul > li > ul > li > a.page-link::before,
    .sidebar-nav li.group > ul > li > ul > li > p > a.page-link::before {
      content: counter(doc-l1) "." counter(doc-l2) " ";
      color: var(--theme-color, currentColor);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '笔记',
      repo: 'https://github.com/swpucwf/Blog',
      loadSidebar: true,
      auto2top: true,
      coverpage: true,
      subMaxLevel: 2,
      alias: {
          '/.*/_sidebar.md': '/_sidebar.md'
      },
      pagination: {
          previousText: '上一章节',
          nextText: '下一章节',
      },
      search: {
          paths: 'auto',
          placeholder: '搜索',
          noData: '找不到结果！',
          namespace: 'swpucwf-blog',
      },
      count:{
          countable: true,
          position: 'top',
          margin: '10px',
          float: 'right',
          fontsize:'0.9em',
          color:'rgb(90,90,90)',
          language:'chinese',
          isExpected: true
        }
    }
  </script>
 <!-- Put them above docsify.min.js -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <!-- full-text search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <!-- code render-->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <!-- reading time / word count -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count@1/dist/countable.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css" />
  <!-- docsify 已将内部 marked 暴露为 window.marked，此处不可再单独引入 marked，否则 search 插件解析表格时报错 -->
  <!-- CDN files for docsify-katex -->
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@2/dist/docsify-katex.js"></script>
</body>
</html>
