<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI笔记</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 全部静态依赖自托管于 vendor/：jsdelivr 在部分网络下不可达，避免 CDN 失败导致整页白屏 -->
  <link rel="stylesheet" href="vendor/docsify/themes/core.min.css">
  <!-- Vue 主题附加（保持 v4 外观），必须加在 core 主题之后 -->
  <link rel="stylesheet" href="vendor/docsify/themes/addons/vue.min.css">
  <style>
    /* ===== 字体协调 ===== */
    :root {
      /* 统一中英文字体族：优先苹方/微软雅黑/思源黑体，避免中英混排字形打架 */
      --base-font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                          "Noto Sans SC", -apple-system, "Segoe UI", Roboto,
                          Helvetica, Arial, sans-serif;
      --code-font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
                          Monaco, "Courier New", monospace;
    }
    body, .sidebar, .markdown-section {
      font-family: var(--base-font-family);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* 标题字号阶梯：h1>h2>h3>h4 逐级递减，字重适中（中文不宜过粗） */
    .markdown-section h1 { font-size: 1.85em; font-weight: 700; line-height: 1.3; }
    .markdown-section h2 { font-size: 1.5em;  font-weight: 700; letter-spacing: .3px; }
    .markdown-section h3 { font-size: 1.25em; font-weight: 600; }
    .markdown-section h4 { font-weight: 600; }
    /* 行内代码用等宽字体，字号略小于正文以协调 */
    .markdown-section code { font-family: var(--code-font-family); font-size: .9em; }

    /* 简历排版优化（前端） */
    .markdown-section { line-height: 1.85; }
    .markdown-section p { margin: 0.7em 0; }
    .markdown-section ul { margin: 0.7em 0; }
    .markdown-section li { margin: 0.4em 0; }
    /* 公司名（h3）与项目标题（h4）拉开层级，h4 加左侧强调条 */
    .markdown-section h3 { margin-top: 1.8em; }
    .markdown-section h4 {
      margin-top: 1.6em; margin-bottom: 0.6em;
      padding-left: 0.6em;
      border-left: 3px solid var(--theme-color, #42b983);
      font-size: 1.08em;
    }
    /* 联系方式：竖线 + 淡色卡片，更紧凑清晰 */
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color, #42b983);
      background: rgba(66, 185, 131, 0.06);
      padding: 0.9em 1.3em; margin: 1em 0;
    }
    .markdown-section blockquote p { margin: 0.3em 0; }

    /* 侧边栏分组可折叠（docsify-sidebar-collapse）：只引插件 JS，不引它自带的 CSS（会把 li 边距归零破坏缩进），
       用以下自写样式在分组父项右侧显示 +/- 折叠指示 */
    .sidebar-nav li.folder { position: relative; cursor: pointer; }
    .sidebar-nav li.folder::after {
      content: '+';
      position: absolute; top: 11px; right: 10px;
      transform: translateY(-50%);
      color: #a4a4ac; font-size: 15px;
    }
    .sidebar-nav li.folder.open::after { content: '\2212'; } /* 展开状态显示减号 */

    /* 系列文章“上一篇/下一篇”导航（由自定义插件生成，卡片式） */
    .series-pager { display: flex; gap: 16px; margin-top: 2.8em; }
    .series-pager .pager-item {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;
      padding: 14px 18px; border: 1px solid #eaecef; border-radius: 10px;
      text-decoration: none; color: inherit; transition: border-color .2s, box-shadow .2s;
    }
    .series-pager .pager-item:hover {
      border-color: var(--theme-color, #42b983);
      box-shadow: 0 3px 12px rgba(66, 185, 131, 0.14);
    }
    .series-pager .pager-next { align-items: flex-end; text-align: right; }
    .series-pager .pager-label { font-size: .82em; color: #9a9a9a; letter-spacing: .5px; }
    .series-pager .pager-title {
      font-size: 1em; font-weight: 500; color: var(--theme-color, #42b983);
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .series-pager .pager-empty { visibility: hidden; }

    /* 封面页：初始隐藏左侧目录与切换按钮，下滑进入正文后再滑入（由 coverAwareSidebar 插件切换 body.cover-page） */
    .sidebar, .sidebar-toggle {
      transition: transform .35s ease, opacity .35s ease, visibility .35s ease;
    }
    body.cover-page .sidebar {
      opacity: 0; visibility: hidden; transform: translateX(-100%);
    }
    body.cover-page .sidebar-toggle {
      opacity: 0; visibility: hidden;
    }

    /* ===== Mermaid 流程图 ===== */
    .markdown-section .mermaid {
      margin: 1.4em 0;
      padding: 1em;
      text-align: center;
      overflow-x: auto;
      background: #fafbfc;
      border: 1px solid #eaecef;
      border-radius: 8px;
    }
    .markdown-section .mermaid svg { max-width: 100%; height: auto; }
    /* 单个图语法出错时保留源码，不影响其它图渲染 */
    .markdown-section .mermaid-error {
      text-align: left; font-family: var(--code-font-family); font-size: .9em;
      white-space: pre; color: #b42318;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      repo: 'https://github.com/swpucwf/Blog',
      loadSidebar: true,
      auto2top: true,
      coverpage: true,
      subMaxLevel: 0,
      // 侧边栏折叠（docsify-sidebar-collapse）：0 = 分组默认全部收缩，点击父项才展开子目录
      sidebarDisplayLevel: 0,
      alias: {
          '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
          paths: 'auto',
          placeholder: '搜索',
          noData: '找不到结果！',
          namespace: 'swpucwf-blog',
      },
      count:{
          countable: true,
          position: 'top',
          margin: '10px',
          float: 'right',
          fontsize:'0.9em',
          color:'rgb(90,90,90)',
          language:'chinese',
          isExpected: true
        },
      // 提示框插件（flexible-alerts）：把 `> [!TIP]` 等引用块渲染成彩色提示框，标签用中文
      'flexible-alerts': {
        style: 'callout',
        note:      { label: '说明' },
        tip:       { label: '技巧' },
        warning:   { label: '注意' },
        important: { label: '重要' },
        attention: { label: '警告' }
      },
      // 自定义“上一篇/下一篇”分页插件：按当前文章所在目录的 README.md 链接顺序生成导航，
      // 无需子侧边栏；以后每个新系列只要在其 README 里列出章节即可自动生效。
      plugins: [
        // CSDN 图床防盗链：带 Referer 的请求会 403，渲染时给所有 img 加 no-referrer 策略
        function noReferrerImages(hook) {
          hook.afterEach(function (html) {
            return html.replace(/<img\s/gi, '<img referrerpolicy="no-referrer" ');
          });
        },
        // Mermaid 流程图：把 ```mermaid 代码块替换成 SVG。仅当当前页存在图时按需加载 mermaid，
        // 避免每个页面都加载体积较大的渲染库；加载失败时保留原始代码块，不影响阅读。
        function mermaidRender(hook) {
          var loading = false, queue = [];
          function findBlocks() {
            var pres = document.querySelectorAll('.markdown-section pre');
            var out = [];
            for (var i = 0; i < pres.length; i++) {
              var pre = pres[i], code = pre.querySelector('code');
              var flag = ((pre.getAttribute('data-lang') || '') + ' ' + pre.className + ' ' +
                          (code ? code.className : '')).toLowerCase();
              if (flag.indexOf('mermaid') !== -1) out.push(pre);
            }
            return out;
          }
          function markError(node, err) {
            node.classList.add('mermaid-error');
            console.warn('[mermaid] 渲染失败', err);
          }
          function draw() {
            if (window.__mermaidLoadFailed) return;
            var blocks = findBlocks();
            if (!blocks.length) return;
            if (!window.mermaid) { load(draw); return; }
            if (!window.__mermaidInited) {
              window.mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'loose',
                theme: 'default',
                fontFamily: '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif'
              });
              window.__mermaidInited = true;
            }
            var nodes = [];
            for (var i = 0; i < blocks.length; i++) {
              var pre = blocks[i], code = pre.querySelector('code');
              var div = document.createElement('div');
              div.className = 'mermaid';
              div.textContent = (code || pre).textContent;
              pre.parentNode.replaceChild(div, pre);
              nodes.push(div);
            }
            // 逐图渲染并隔离错误：一张图语法有误不影响其它图
            (function next(i) {
              if (i >= nodes.length) return;
              var p;
              try { p = window.mermaid.run({ nodes: [nodes[i]] }); }
              catch (e) { markError(nodes[i], e); next(i + 1); return; }
              Promise.resolve(p).then(function () { next(i + 1); }, function (e) {
                markError(nodes[i], e); next(i + 1);
              });
            })(0);
          }
          function load(cb) {
            queue.push(cb);
            if (loading) return;
            loading = true;
            var urls = [
              'vendor/mermaid/mermaid.min.js',
              '//unpkg.com/mermaid@11/dist/mermaid.min.js',
              '//registry.npmmirror.com/mermaid/11/files/dist/mermaid.min.js'
            ];
            (function tryNext(i) {
              if (i >= urls.length) {
                loading = false;
                window.__mermaidLoadFailed = true;
                console.warn('[mermaid] 加载失败，保留原始代码块');
                return;
              }
              var s = document.createElement('script');
              s.src = urls[i];
              s.onload = function () {
                loading = false;
                var list = queue; queue = [];
                for (var j = 0; j < list.length; j++) list[j]();
              };
              s.onerror = function () { if (s.parentNode) s.parentNode.removeChild(s); tryNext(i + 1); };
              document.head.appendChild(s);
            })(0);
          }
          hook.doneEach(function () {
            window.setTimeout(function () { if (findBlocks().length) draw(); }, 0);
          });
        },
        function seriesPager(hook, vm) {
          var cache = { folder: null, links: null };
          function clean(p) { return (p || '').split('?')[0].split('#')[0]; }
          function folderOf(p) { var i = p.lastIndexOf('/'); return i <= 0 ? '' : p.substring(0, i); }
          function fetchSeq(folder, cb) {
            if (cache.folder === folder) { cb(cache.links); return; }
            fetch(folder.substring(1) + '/README.md')
              .then(function (r) { return r.ok ? r.text() : ''; })
              .catch(function () { return ''; })
              .then(function (md) {
                var links = [], re = /\[([^\]]+)\]\((\/[^)\s]+?)\)/g, m;
                while ((m = re.exec(md)) !== null) {
                  links.push({ text: m[1], path: clean(m[2]).replace(/\.md$/, '') });
                }
                cache.folder = folder; cache.links = links;
                cb(links);
              });
          }
          hook.doneEach(function () {
            var content = document.querySelector('.markdown-section');
            if (!content) return;
            var old = document.getElementById('series-pager');
            if (old && old.parentNode) old.parentNode.removeChild(old);
            var route;
            try { route = clean(decodeURIComponent((location.hash || '').replace(/^#/, ''))); }
            catch (e) { route = clean((location.hash || '').replace(/^#/, '')); }
            if (!route || route === '/') return;
            var folder = folderOf(route);
            if (!folder) return;
            fetchSeq(folder, function (links) {
              var seq = [{ text: '返回目录', path: folder + '/README' }].concat(links);
              var idx = -1;
              for (var i = 0; i < seq.length; i++) { if (seq[i].path === route) { idx = i; break; } }
              if (idx < 0) return;
              var prev = idx > 0 ? seq[idx - 1] : null;
              var next = idx < seq.length - 1 ? seq[idx + 1] : null;
              var box = document.createElement('div');
              box.id = 'series-pager'; box.className = 'series-pager';
              box.innerHTML =
                (prev ? '<a class="pager-item pager-prev" href="#' + prev.path + '"><span class="pager-label">&larr; 上一篇</span><span class="pager-title">' + prev.text + '</span></a>' : '<span class="pager-item pager-empty"></span>') +
                (next ? '<a class="pager-item pager-next" href="#' + next.path + '"><span class="pager-label">下一篇 &rarr;</span><span class="pager-title">' + next.text + '</span></a>' : '<span class="pager-item pager-empty"></span>');
              content.appendChild(box);
            });
          });
        },
        // 封面页侧边栏联动：docsify 封面 section.cover 为 relative、z-index 低于 .sidebar(absolute)，
        // 桌面宽度下目录会盖在封面上方；且封面的 show class 不随滚动移除，故按滚动位置判断：
        // 封面仍占据大半屏时给 body 加 cover-page 类隐藏目录，下滑进入正文后再显示。
        function coverAwareSidebar(hook) {
          function update() {
            var cover = document.querySelector('.cover.show');
            var onCover = false;
            if (cover) {
              var rect = cover.getBoundingClientRect();
              var h = window.innerHeight || document.documentElement.clientHeight || 0;
              onCover = rect.bottom > h * 0.5;
            }
            document.body.classList.toggle('cover-page', onCover);
          }
          hook.doneEach(function () { window.setTimeout(update, 0); });
          if (!window.__coverSidebarBound) {
            window.__coverSidebarBound = true;
            window.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', update, { passive: true });
          }
          update();
        }
      ]
    }
  </script>
  <!-- 自动刷新开关：在网址后加 ?autoreload=秒数 即可定时重载以加载最新内容（如 ?autoreload=5）。
       仅对带该参数的开发者生效，普通访客不受影响；加时间戳绕过缓存。默认关闭。 -->
  <script>
    (function () {
      var m = /[?&]autoreload=(\d+)/.exec(location.search);
      if (!m) return;
      var sec = Math.max(2, parseInt(m[1], 10) || 5);
      setTimeout(function () {
        var base = location.origin + location.pathname;
        // 保留 autoreload 参数，替换/追加时间戳以绕过缓存，实现持续自动刷新
        var clean = location.search.replace(/([?&])_ts=\d+(&?)/, '$1').replace(/[?&]$/, '');
        var joiner = clean.indexOf('?') >= 0 ? '&' : '?';
        // 保留 location.hash（docsify 用 hash 路由），刷新后停在当前页而非回首页
        location.href = base + clean + joiner + '_ts=' + Date.now() + location.hash;
      }, sec * 1000);
    })();
  </script>
 <!-- Put them above docsify.min.js -->
  <script src="vendor/docsify/docsify.min.js"></script>
  <!-- 中英文/数字/符号之间自动添加空格（pangu.js） -->
  <script src="vendor/pangu/docsify-pangu.min.js"></script>
  <!-- full-text search -->
  <script src="vendor/docsify/plugins/search.min.js"></script>
  <!-- 提示框：将 `> [!NOTE]` / `> [!TIP]` 等引用块转为彩色 alert -->
  <script src="vendor/flexible-alerts/docsify-plugin-flexible-alerts.min.js"></script>
  <!-- 图片点击放大（docsify 官方插件，基于 medium-zoom；给 img 加 .no-zoom 类可单独禁用） -->
  <script src="vendor/docsify/plugins/zoom-image.min.js"></script>
  <!-- 阅读进度条（docsify-progress）：默认挂在侧边栏顶部，随滚动显示当前文章阅读进度 -->
  <script src="vendor/progress/progress.min.js"></script>
  <!-- 侧边栏目录折叠：支持分组父项点击展开/收缩（注意不要引入其自带 sidebar.min.css） -->
  <script src="vendor/sidebar-collapse/docsify-sidebar-collapse.min.js"></script>
  <!-- code render-->
  <script src="vendor/prism/prism-bash.min.js"></script>
  <script src="vendor/prism/prism-python.min.js"></script>
  <script src="vendor/copy-code/docsify-copy-code.min.js"></script>
  <!-- reading time / word count -->
  <script src="vendor/count/countable.min.js"></script>

  <script src="vendor/katex/katex.min.js"></script>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <!-- docsify 已将内部 marked 暴露为 window.marked，此处不可再单独引入 marked，否则 search 插件解析表格时报错 -->
  <!-- 本地自托管 katex 与 docsify-katex，字体随 css 从 vendor/katex/fonts 加载 -->
  <script src="vendor/katex/docsify-katex.js"></script>
</body>
</html>
